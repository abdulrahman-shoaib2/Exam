<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wanderlust - Your Global Travel Planner (Starter)</title>

    <!-- Font Awesome -->
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: "nest" };
    </script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- SweetAlert2 -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">


    <!-- Stylesheets-->
    <link rel="stylesheet" href="./src/css/base.css" />
    <link rel="stylesheet" href="./src/css/layout.css" />
    <link rel="stylesheet" href="./src/css/components.css" />
    <link rel="stylesheet" href="./src/css/dashboard.css" />
    <link rel="stylesheet" href="./src/css/views.css" />
    <link rel="stylesheet" href="./src/css/weather.css" />
    <link rel="stylesheet" href="./src/css/widgets.css" />
    <link rel="stylesheet" href="./src/css/utilities.css" />
  </head>
  <body>
    <div id="app" class="flex min-h-screen">
      <!-- ======================= SIDEBAR ======================= -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-logo">
          <div class="logo-icon"><i class="fa-solid fa-paper-plane"></i></div>
          <span class="logo-text">Wanderlust</span>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section">
            <span class="nav-section-title">Main</span>
            <a href="#dashboard" data-view="dashboard" class="nav-item active">
              <i class="fa-solid fa-house"></i><span>Dashboard</span>
            </a>
          </div>

          <div class="nav-section">
            <span class="nav-section-title">Explore</span>
            <a href="#holidays" data-view="holidays" class="nav-item">
              <i class="fa-solid fa-calendar-days"></i><span>Holidays</span>
            </a>
            <a href="#events" data-view="events" class="nav-item">
              <i class="fa-solid fa-ticket"></i><span>Events</span>
            </a>
            <a href="#weather" data-view="weather" class="nav-item">
              <i class="fa-solid fa-cloud-sun"></i><span>Weather</span>
            </a>
            <a href="#long-weekends" data-view="long-weekends" class="nav-item">
              <i class="fa-solid fa-umbrella-beach"></i
              ><span>Long Weekends</span>
            </a>
          </div>

          <div class="nav-section">
            <span class="nav-section-title">Travel Tools</span>
            <a href="#currency" data-view="currency" class="nav-item">
              <i class="fa-solid fa-money-bill-transfer"></i
              ><span>Currency</span>
            </a>
            <a href="#sun-times" data-view="sun-times" class="nav-item">
              <i class="fa-solid fa-sun"></i><span>Sun Times</span>
            </a>
          </div>

          <div class="nav-section">
            <span class="nav-section-title">Personal</span>
            <a href="#my-plans" data-view="my-plans" class="nav-item">
              <i class="fa-solid fa-heart"></i><span>My Plans</span>
              <span id="plans-count" class="nav-badge hidden">0</span>
            </a>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-user">
            <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
            <div class="user-info">
              <span class="user-name">Traveler</span>
              <span class="user-status">Planning mode</span>
            </div>
          </div>
        </div>
      </aside>

      <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

      <!-- ======================= MAIN CONTENT ======================= -->
      <div class="main-wrapper">
        <!-- ======================= TOP HEADER ======================= -->
        <header id="top-header" class="top-header">
          <button id="mobile-menu-btn" class="mobile-menu-btn">
            <i class="fa-solid fa-bars"></i>
          </button>

          <div class="header-title">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle">
              Welcome back! Ready to plan your next adventure?
            </p>
          </div>

          <div class="header-actions">
            <div class="header-datetime">
              <i class="fa-regular fa-clock"></i>
              <span id="current-datetime">Sat, Jan 25, 08:30 AM</span>
            </div>
          </div>
        </header>

        <!-- ======================= MAIN CONTENT AREA ======================= -->
        <main id="main-content" class="main-content">
          <!-- ==================== DASHBOARD VIEW ==================== -->


          <!-- ==================== HOLIDAYS VIEW - STATIC EGYPT 2026 DATA ==================== -->


          <!-- ==================== EVENTS VIEW - STATIC CAIRO DATA ==================== -->


          <!-- ==================== WEATHER VIEW - STATIC CAIRO DATA ==================== -->
          

          <!-- ==================== LONG WEEKENDS VIEW - STATIC EGYPT DATA ==================== -->
          

          <!-- ==================== CURRENCY CONVERTER VIEW - STATIC DATA ==================== -->
          

          <!-- ==================== SUN TIMES VIEW - STATIC CAIRO DATA ==================== -->
          

          <!-- ==================== MY PLANS VIEW - EMPTY STATE ==================== -->
          
        </main>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
      <div class="loading-content">
        <div class="loading-spinner">
          <i
            class="fa-solid fa-paper-plane fa-spin"
            style="font-size: 32px; color: var(--primary-500)"
          ></i>
        </div>
        <p id="loading-text">Loading...</p>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container">

    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-content">
        <button class="modal-close" id="modal-close-btn">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="modal-body"></div>
      </div>
    </div>
    <script type="module" src="./src/js/main.js">

    </script>

  </body>
</html>
